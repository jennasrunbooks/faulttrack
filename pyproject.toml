[project]
name = "faulttrack"
dynamic = ["version"]
description = "Classify the fault type and suspect service behind a microservice alert from Prometheus metrics (RCAEval RE2)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "python-multipart>=0.0.33",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/faulttrack/__init__.py"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
# spike/ is the go/no-go exploration, kept as it was run (not graded, not imported).
extend-exclude = ["spike"]

[tool.ruff.lint]
# Ruff's defaults (real errors: undefined names, unused imports, syntax issues)
# plus import sorting, common bug patterns and modern-Python upgrades
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
# spike/ is left as it was run (see [tool.ruff]); the rest are pyright's defaults,
# which setting exclude replaces.
exclude = ["spike", "**/__pycache__", "**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# predict.py sits at the repo root (course layout), so tests can import it.
pythonpath = ["."]
