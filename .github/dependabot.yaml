# Issue: #4   Plan line: 3
# Why: weekly dependency updates for uv, GitHub Actions and Docker base images, minor + patch grouped per ecosystem
# Secrets/permissions needed: none (turn on Dependabot alerts and security updates in Settings -> Advanced Security)

version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      uv-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, ci]

  # "/" has no Dockerfile until plan line 10; Dependabot reports nothing to update there until then.
  # Decline any bump that moves a Python base image off 3.12 (e.g. python:1-3.12-bookworm ->
  # 1-3.13-bookworm): the project requires >=3.12,<3.13 and .python-version pins 3.12.
  - package-ecosystem: docker
    directories: [/, /.devcontainer]
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, docker]
