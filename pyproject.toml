[project]
name = "faulttrack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Ruff's defaults (real errors: undefined names, unused imports, syntax issues)
# plus import sorting, common bug patterns and modern-Python upgrades
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pyright]
venvPath = "."
venv = ".venv"
