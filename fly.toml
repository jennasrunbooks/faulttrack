# Fly.io config for FaultTrack (spec Section 6, "Deployment"). Maintainer-run only:
# `make deploy` from the Mac host. The devcontainer has no Fly.io credentials.
#
# First time: `fly launch --no-deploy --copy-config`, then `fly deploy`, then
# `fly certs add faulttrack.jennasrunbooks.com` and the DNS record (README "Deploy").

app = "faulttrack"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  # The Dockerfile starts uvicorn on $PORT; keep this equal to internal_port below.
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero: the machine stops when idle; the first request starts it again.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
